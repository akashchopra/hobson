function clearBoat() {
  while (boatGroup.children.length) boatGroup.remove(boatGroup.children[0]);
  lights = {};
}

function buildHull() {
  const mainCX = bowLength / 2;
  const bowCX = totalLength / 2 + bowLength / 2;

  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(mainHullLength, hullHeight, hullWidth),
    new THREE.MeshStandardMaterial({ color: 0xdddddd })
  );
  hull.position.set(mainCX, hullHeight / 2, 0);
  boatGroup.add(hull);

  const bowGeometry = new THREE.BoxGeometry(
    bowLength,      // X (forward)
    hullHeight,     // Y (vertical)
    hullWidth       // Z (beam)
  );

  // Move geometry so its base sits at x = 0
  bowGeometry.translate(bowLength / 2, 0, 0);

  // Now taper the front face into a point
  const pos = bowGeometry.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);

    // 0 at hull face, 1 at bow tip
    const t = x / bowLength;

    // shrink width and height toward bow tip
    const scale = 1 - t;

    //pos.setY(i, pos.getY(i) * scale);
    pos.setZ(i, pos.getZ(i) * scale);
  }

  pos.needsUpdate = true;
  bowGeometry.computeVertexNormals();

  const bow = new THREE.Mesh(
    bowGeometry,
    new THREE.MeshStandardMaterial({ color: 0xdddddd })
  );

  const bowEndX = (mainHullLength + bowLength) / 2;

  bow.position.set(
    bowEndX,
    hullHeight / 2,
    0
  );

  boatGroup.add(bow);
}

function buildVessel(type) {
  clearBoat();
  buildHull();

  if (type === 'sailing') {
    const mast = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, mastHeight, 8),
      new THREE.MeshStandardMaterial({ color: 0x888888 })
    );
    mast.position.set(mastheadX, hullHeight + mastHeight / 2, 0);
    boatGroup.add(mast);
  } else {
    const cabinLen = mainHullLength * 0.3;
    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(cabinLen, 1.5, hullWidth * 0.7),
      new THREE.MeshStandardMaterial({ color: 0xeeeeee })
    );
    cabin.position.set(mainHullLength / 4 - cabinLen, hullHeight + 0.75, 0);
    boatGroup.add(cabin);
  }

  configs[type].lights.forEach(cfg => addLight(cfg));

  document.getElementById('vessel-title').textContent = configs[type].title;
  document.getElementById('vessel-desc').textContent = configs[type].desc;
}

//   // THREE:  0  = +X, counterclockwise positive
//   return THREE.MathUtils.degToRad(-deg);

function colregToThreeRad(deg) {
  // COLREG: 0° = bow, + = starboard (clockwise)
  // THREE:  0 = +X, + = CCW
  return THREE.MathUtils.degToRad(deg);
}

function normalizeSector(min, max) {
  let start = min;
  let end = max;

  // convert to radians
  start = THREE.MathUtils.degToRad(start);
  end = THREE.MathUtils.degToRad(end);

  // ensure shortest direction handling
  let delta = end - start;

  if (delta < 0) delta += Math.PI * 2;

  return { start, delta };
}

function addSector(cfg) {
  const radius = 20;

  const { start, delta } = normalizeSector(cfg.min, cfg.max);

  const segments = 32;

  const geometry = new THREE.BufferGeometry();

  const vertices = [0, 0, 0];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const angle = start + delta * t;

    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;

    vertices.push(x, 0, z);

    if (i < segments) {
      indices.push(0, i + 1, i + 2);
    }
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(vertices, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const material = new THREE.MeshBasicMaterial({
    color: cfg.color,
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const sector = new THREE.Mesh(geometry, material);

  sector.position.set(cfg.x, cfg.y + 0.05, cfg.z);

  boatGroup.add(sector);
  return sector;
}





function addLight(cfg) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshStandardMaterial({ color: cfg.color, emissive: cfg.color, emissiveIntensity: 3.0, roughness: 0.1 })
  );
  mesh.position.set(cfg.x, cfg.y, cfg.z);
  mesh.add(new THREE.PointLight(cfg.color, 2, 15));
  boatGroup.add(mesh);

  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  if (cfg.label != '') {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 256, 64);
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText(cfg.label, 128, 42);
  }

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
  sprite.scale.set(3, 0.75, 1);
  sprite.position.set(cfg.x, cfg.y + 1.5, cfg.z);
  boatGroup.add(sprite);

  lights[cfg.name] = { mesh, sprite, min: cfg.min, max: cfg.max };
  const sector = addSector(cfg);
  lights[cfg.name].sector = sector;
}

function getBearingFromBoat() {
  const boatPos = new THREE.Vector3();
  boatGroup.getWorldPosition(boatPos);

  const camPos = camera.position.clone();

  // Direction from boat → camera (XZ plane only)
  const dir = camPos.sub(boatPos);
  dir.y = 0;
  dir.normalize();

  // Boat forward direction (its local +X axis in world space)
  const forward = new THREE.Vector3(1, 0, 0);
  forward.applyQuaternion(boatGroup.quaternion);
  forward.y = 0;
  forward.normalize();

  // Signed angle between forward and camera direction
  const angle = Math.atan2(
    forward.x * dir.z - forward.z * dir.x, // cross product (Y component)
    forward.x * dir.x + forward.z * dir.z  // dot product
  );

  return angle * (180 / Math.PI); // -180 to +180
}


function updateVisibility() {
  const b = getBearingFromBoat();

  for (const l of Object.values(lights)) {
    const vis = l.min < l.max
      ? (b >= l.min && b <= l.max)
      : (b <= l.max || b >= l.min);

    l.mesh.visible = vis;
    l.sprite.visible = vis;
    if (l.sector) l.sector.visible = vis;
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateVisibility();
  renderer.render(scene, camera);
}

  controls.update();
});

window.addEventListener('resize', () => {
